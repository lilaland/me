# Photos for the site's photos view, in display order.
#
#   uv run scripts/photos/import_photos.py "~/Documents/lila site photos"
#
# file         the original's name in that folder (entries without one are skipped)
# caption      shown under the photo
# place        the location line
# lat, lon     used only when the photo has no GPS of its own
# elevation_m  used only when the photo has no GPS altitude; shown with "≈"
# id           optional; output name, defaults to the file name

